<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Editor de elementos - Defensa de Obligado</title>
    <style>
      body { margin: 0; display: flex; height: 100vh; font: 13px monospace; background: #222; color: #eee; }
      aside { width: 260px; padding: 8px; overflow-y: auto; background: #111; }
      main { flex: 1; overflow: auto; padding: 8px 16px; }
      h3 { margin: 12px 0 4px; }
      ul { margin: 0 0 4px; padding-left: 16px; }
      li { cursor: pointer; }
      label { display: inline-block; width: 220px; }
      input { width: 120px; }
      .new { width: 120px; }
      .effect { margin: 4px 0 4px 220px; }
      .effect input { width: 60px; }
      canvas, img { vertical-align: middle; margin-left: 8px; }
      img { height: 32px; image-rendering: pixelated; }
      #login { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #222; }
      #login input { width: 200px; }
    </style>
  </head>
  <body>
    <aside>
      <p><button id="save">Guardar todo</button></p>
      <div id="lists"></div>
    </aside>
    <main id="form"></main>
    <script type="module" src="/src/elements/main.js"></script>
  </body>
</html>
